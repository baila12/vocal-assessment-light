[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = .
markers =
    unit: unit tests
    integration: integration tests (pytest tests/integration/ -v)
    e2e: end-to-end tests
    slow: slow tests (full audio pipeline)
    smoke: smoke tests
    bdd: BDD behavior-driven tests
    browser: browser-based tests requiring Playwright

# asyncio_mode requires pytest-asyncio 0.21+
# asyncio_mode = auto

# Filter external library deprecation warnings (not our code)
filterwarnings =
    ignore:.*TripleDES.*
    ignore:.*Blowfish.*
    ignore:.*aifc.*
    ignore:.*audioop.*
    ignore:.*sunau.*
    ignore:.*swigvarlink.*
    ignore:.*SwigPy.*
    ignore:.*builtin type.*
    ignore:.*HTTP_422.*
    ignore:.*starlette.middleware.wsgi.*
    ignore:.*Unknown config option.*
    # v7.15 P2-15: starlette 1.3+ TestClient 外部依赖告警 — httpx → httpx2 迁移提示
    # (外部库选择提示, 非本项目代码; 如后续启用 httpx2 依赖可移除本行)
    ignore:.*Using.*httpx.*starlette\.testclient.*deprecated.*
