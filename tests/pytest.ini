[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = .
markers =
    unit: unit tests
    integration: integration tests (pytest tests/integration/ -v)
    e2e: end-to-end tests
    slow: slow tests (full audio pipeline)
    smoke: smoke tests
asyncio_mode = auto
