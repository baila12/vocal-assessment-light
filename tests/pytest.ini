[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
pythonpath = .
markers =
    slow: slow tests (full audio pipeline / ONNX 模型推理)
    browser: browser-based tests requiring Playwright

# Filter external library deprecation warnings (not our code)
filterwarnings =
    ignore:.*TripleDES.*
    ignore:.*Blowfish.*
    ignore:.*aifc.*
    ignore:.*audioop.*
    ignore:.*sunau.*
    ignore:.*swigvarlink.*
    ignore:.*SwigPy.*
    ignore:.*builtin type.*
    ignore:.*HTTP_422.*
    ignore:.*starlette.middleware.wsgi.*
    # v7.15 P2-15: httpx2 已启用 (starlette 1.3+ TestClient 官方依赖), 原 httpx 弃用告警抑制行已移除
    # v7.19 整理: 移除 ignore Unknown config option — 不再静默吞真实配置告警
