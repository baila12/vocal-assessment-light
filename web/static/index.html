<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>声乐评估系统</title>

    <!-- 设计系统 & 样式 -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layouts.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/report.css">
    <link rel="stylesheet" href="/css/pages/sing.css">
    <link rel="stylesheet" href="/css/pages/history.css">
    <link rel="stylesheet" href="/css/pages/compare.css">
    <link rel="stylesheet" href="/css/pages/settings.css">

    <!-- GSAP (本地) -->
    <script src="/lib/gsap/gsap.min.js"></script>
    <!-- Chart.js (本地) -->
    <script src="/lib/chart.js/chart.umd.min.js"></script>

    <style>
        .page { display: block; }  /* 覆盖 components.css 旧 .page { display: none; } */
        #globalProgressBar {
            position: fixed; top: 0; left: 0; height: 3px;
            background: var(--primary); z-index: calc(var(--z-sticky) + 1);
            width: 0%; transform-origin: left center;
        }
    </style>
</head>
<body>
    <div class="toast-wrap" id="toastWrap" role="alert" aria-live="polite"></div>
    <div id="globalProgressBar"></div>
    <header id="topNavContainer"></header>
    <main id="pageContainer"></main>
    <nav id="bottomNavContainer"></nav>
    <script type="module" src="/app.js"></script>
</body>
</html>
