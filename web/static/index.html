<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>声乐评估系统 — VAS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #0f172a; color: #e2e8f0;
        }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 2rem; margin-bottom: 1rem; color: #38bdf8; }
        p { font-size: 1.1rem; margin-bottom: 1.5rem; line-height: 1.6; color: #94a3b8; }
        .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-block; padding: 0.75rem 1.5rem;
            background: #1e293b; color: #38bdf8; text-decoration: none;
            border-radius: 0.5rem; border: 1px solid #334155;
            transition: background 0.2s;
        }
        a:hover { background: #334155; }
        .version { margin-top: 2rem; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>声乐评估系统</h1>
        <p>
            v7 架构已升级至 Vue 3 + FastAPI。<br>
            请通过 FastAPI 服务 (端口 8000) 访问新版前端。
        </p>
        <div class="links">
            <a href="http://localhost:8000">新版前端 (Vue 3)</a>
        </div>
        <p class="version">v7.1.3 — Flask legacy SPA 已废弃</p>
    </div>
</body>
</html>
